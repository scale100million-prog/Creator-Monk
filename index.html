    <!-- Guard against third-party analytics/telemetry fetch rejections in preview iframe -->
    <script>
      (function () {
        function isFetchError(val) {
          var msg = (val && val.message) ? String(val.message) : String(val || '');
          return msg.indexOf('Failed to fetch') !== -1 || msg.indexOf('NetworkError') !== -1 || msg.indexOf('Load failed') !== -1;
        }

        window.addEventListener('unhandledrejection', function (event) {
          if (event && isFetchError(event.reason)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function (event) {
          if (event && (isFetchError(event.error) || isFetchError(event.message))) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);

        if (typeof window.fetch === 'function') {
          var origFetch = window.fetch.bind(window);
          window.fetch = function (input, init) {
            var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
            if (url.indexOf('pipedream.wistia.com') !== -1 || url.indexOf('distillery.wistia.com') !== -1) {
              return Promise.resolve(new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } }));
            }
            try {
              return origFetch(input, init).catch(function () {
                return new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } });
              });
            } catch (err) {
              return Promise.resolve(new Response('{}', { status: 200, headers: { 'Content-Type': 'application/json' } }));
            }
          };
        }

        var origConsoleError = console.error;
        if (typeof origConsoleError === 'function') {
          console.error = function () {
            for (var i = 0; i < arguments.length; i++) {
              if (isFetchError(arguments[i])) return;
            }
            return origConsoleError.apply(console, arguments);
          };
        }
      })();
    </script>
